name: TECRA IT CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

  build-production:
    name: Next.js Production Build
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: tecra_super_secret_auth_key_change_in_production_min_32_chars
      ADMIN_SEED_EMAIL: admin@tecra.sriet.ac.in
      ADMIN_SEED_PASSWORD: TecraAdminSecurePass2026!
      DATABASE_URL: mongodb://localhost:27017/tecra_it
      NEXT_PUBLIC_SITE_URL: https://tecra.sriet.ac.in
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Validate Build Output
        run: |
          test -d .next || (echo "Error: .next folder not created" && exit 1)
          echo "Production build verified successfully."
